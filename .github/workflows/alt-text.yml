name: Alt-text fixer

# pdf-crawler style trigger: open an issue titled `FIX: <pdf url>` and the
# workflow drafts alt-texts with the server-side key (never exposed to Pages).
on:
  issues:
    types: [opened, reopened]
  workflow_dispatch:
    inputs:
      pdf_url:
        description: Direct URL to a PDF
        required: true
      model:
        description: Vision model
        default: qwen2.5-vl

permissions:
  contents: read
  issues: write

jobs:
  fix:
    if: startsWith(github.event.issue.title, 'FIX:') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Draft alt-texts
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL || 'https://api.openai.com/v1' }}
          VLM_MODEL: ${{ inputs.model || 'gpt-4o-mini' }}
        run: |
          PDF_URL="${{ inputs.pdf_url }}"
          if [ -z "$PDF_URL" ]; then
            PDF_URL=$(echo "${{ github.event.issue.title }}" | sed 's/^FIX:[ ]*//')
          fi
          curl -sSL "$PDF_URL" -o input.pdf
          python scripts/generate_alt.py --pdf input.pdf --out alt-texts.json
      - name: Comment results
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const drafts = JSON.parse(fs.readFileSync('alt-texts.json', 'utf8'));
            const rows = drafts.slice(0, 20).map(d =>
              `| ${d.page} | ${d.id} | ${(d.alt || '*failed*').slice(0, 120)} | ${d.decorative ? 'yes' : 'no'} |`).join('\n');
            const body = `Alt-text drafts (${drafts.length} images, showing 20):\n\n| page | id | draft | decorative |\n|---|---|---|---|\n${rows}\n\nFull JSON attached as workflow artifact. Edit before tagging a real PDF.`;
            const issue = context.payload.issue?.number;
            if (issue) await github.rest.issues.createComment({ ...context.repo, issue_number: issue, body });
      - uses: actions/upload-artifact@v4
        with:
          name: alt-texts
          path: alt-texts.json
